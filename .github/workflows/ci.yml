name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: JavaScript syntax
        run: |
          set -e
          for f in $(git ls-files '*.js'); do node --check "$f"; done

      - name: Manifest, changelog, no private snapshots
        run: python scripts/check.py

      - name: Lint the extension (web-ext)
        run: npx --yes web-ext@10.7.0 lint --source-dir . --ignore-files "test/**" "docs/**" "scripts/**" ".github/**" --self-hosted

      - name: Package
        run: python scripts/package.py
